<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Cricket</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="home">
    <header class="home-header">
      <div class="home-logo">🏏 HAND CRICKET</div>
      <p class="home-tagline">Show your fingers. Beat your friends.</p>
    </header>

    <div class="home-grid">
      <main class="screen box" id="screen" aria-live="polite"></main>
      <aside class="groups-panel box" id="groups-panel" aria-label="My groups" hidden></aside>
    </div>

    <p class="home-foot">Laptop + webcam · works best in Chrome</p>
  </div>

  <script type="module" src="home.js"></script>
</body>
</html>
